# cloud.icingtree.com — serves the CloudSpace React SPA (vite build output) and
# reverse-proxies /api and /ws to the Express adapter, keeping the browser same-origin
# (so no CORS and the session cookie stays simple: SameSite=Lax; Secure).
#
#   Browser -> https://cloud.icingtree.com/ ............ static SPA (this server, root below)
#   Browser -> https://cloud.icingtree.com/api/... ..... proxied to the adapter
#   Browser -> wss://cloud.icingtree.com/ws ............ proxied to the adapter (realtime)
#
# The adapter is reached here at its public host https://cloudapi.icingtree.com. If the
# adapter sits on the same box/network, point these proxy_pass lines at its internal
# address instead (e.g. http://127.0.0.1:5000) to skip the extra public TLS hop.

server {
    listen 80;
    server_name cloud.icingtree.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name cloud.icingtree.com;

    ssl_certificate /etc/letsencrypt/live/cloud.icingtree.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cloud.icingtree.com/privkey.pem;

    # vite build output (npm run build -> dist/)
    root /var/www/cloudspace/dist;
    index index.html;

    client_max_body_size 1G;   # file/media uploads flow through /api

    # --- API (Express adapter) --- also carries the OAuth callback /api/auth/callback
    # and OAuth start /api/auth/oauth/start (see OAUTH_MIGRATION.md), so no extra location needed.
    location /api/ {
        proxy_pass https://cloudapi.icingtree.com;
        proxy_ssl_server_name on;
        proxy_set_header Host cloudapi.icingtree.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
    }

    # --- WebSocket (realtime: messages, typing, reactions, notifications) ---
    location /ws {
        proxy_pass https://cloudapi.icingtree.com;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host cloudapi.icingtree.com;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
    }

    # --- SPA static assets + client-side routing fallback ---
    location / {
        try_files $uri $uri/ /index.html;
    }
}
